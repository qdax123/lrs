<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>狼人杀 · 上帝助手</title>
<style>
  :root{
    --bg:#0e1014;
    --panel:#161a22;
    --panel-2:#1d2230;
    --line:#28303f;
    --text:#e7eaf3;
    --muted:#8b95a8;
    --accent:#5b8def;
    --accent-2:#7c5cff;
    --good:#3ddc97;
    --bad:#ff5d6c;
    --warn:#ffb454;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(1200px 600px at 20% -10%, #1a2030 0%, var(--bg) 60%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;
    line-height:1.55;
  }
  /* ---------- 顶栏 ---------- */
  .topbar{
    display:flex;align-items:center;gap:14px;
    padding:10px 16px;height:58px;
    background:rgba(22,26,34,.9);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(6px);
    position:sticky;top:0;z-index:10;
  }
  .brand{font-weight:700;font-size:16px;letter-spacing:.5px;white-space:nowrap;}
  .status{display:flex;gap:8px;flex:1;flex-wrap:wrap;}
  .chip{
    background:var(--panel-2);border:1px solid var(--line);
    padding:3px 10px;border-radius:999px;font-size:12px;color:var(--text);
  }
  .chip.muted{color:var(--muted);}
  .top-actions{display:flex;gap:8px;}
  /* ---------- 按钮 ---------- */
  button{
    font-family:inherit;font-size:13px;cursor:pointer;
    border-radius:9px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);
    padding:8px 14px;transition:.15s ease;
  }
  button:hover:not(:disabled){border-color:var(--accent);background:#222a3b;}
  button:disabled{opacity:.45;cursor:not-allowed;}
  button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;font-weight:600;}
  button.primary:hover:not(:disabled){filter:brightness(1.12);}
  button.danger{border-color:#4a2630;color:var(--bad);}
  button.danger:hover:not(:disabled){background:#2a1a20;border-color:var(--bad);}
  button.ghost{background:transparent;color:var(--muted);}
  button.mini{padding:4px 9px;font-size:12px;border-radius:7px;}
  /* ---------- 布局 ---------- */
  .layout{
    display:grid;
    grid-template-columns:minmax(230px,280px) minmax(0,1fr) minmax(250px,320px);
    gap:14px;padding:14px;
    align-items:start;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    max-height:calc(100vh - 86px);
    overflow-y:auto;
  }
  .panel h2{font-size:15px;margin:0 0 10px;letter-spacing:.4px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .panel-head h2{margin:0;}
  .muted{color:var(--muted);}
  .small{font-size:12px;}
  .hint{color:var(--muted);font-size:12.5px;margin:6px 0 10px;}
  .hint.ok{color:var(--good);}
  .hint.err{color:var(--bad);}
  /* ---------- 玩家席 ---------- */
  .player-list{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
  .player-card{
    display:flex;align-items:center;gap:8px;
    background:var(--panel-2);border:1px solid var(--line);
    border-radius:10px;padding:7px 9px;font-size:13px;
  }
  .player-card.dead{opacity:.42;text-decoration:line-through;}
  .player-card.sheriff{border-color:#6b5a1f;box-shadow:inset 0 0 0 1px rgba(255,196,84,.18);}
  .p-seat{
    min-width:22px;height:22px;border-radius:6px;background:#2a3346;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:var(--muted);
  }
  .p-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .badge{font-size:12px;}
  /* 身份标签 */
  .role-tag{
    font-size:11px;padding:2px 7px;border-radius:999px;
    background:#2a3346;color:var(--muted);white-space:nowrap;
  }
  .role-wolf{background:#3a1f27;color:#ff8b98;}
  .role-villager{background:#232b36;color:#9fb0c6;}
  .role-seer{background:#1e2f4a;color:#7fb4ff;}
  .role-witch{background:#2c2246;color:#b79bff;}
  .role-hunter{background:#3a2c1c;color:#ffbe72;}
  .role-idiot{background:#1f3a33;color:#6fe0b6;}
  /* ---------- 目标选择网格 ---------- */
  .target-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));
    gap:8px;margin:12px 0;
  }
  .target-btn{
    display:flex;align-items:center;gap:7px;
    padding:9px 10px;border-radius:10px;font-size:13px;text-align:left;
  }
  .tb-seat{
    min-width:20px;height:20px;border-radius:5px;background:#2a3346;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);
  }
  .tb-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* ---------- 结果徽章 ---------- */
  .result-badge{
    padding:16px;border-radius:12px;text-align:center;font-size:18px;font-weight:700;
    margin:12px 0;border:1px solid var(--line);background:var(--panel-2);
  }
  .result-badge.good{color:var(--good);border-color:#1f4a3a;background:#14261f;}
  .result-badge.bad{color:var(--bad);border-color:#4a2630;background:#261419;}
  .death-line{color:var(--bad);font-weight:600;}
  /* ---------- 表单 ---------- */
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .field.inline{flex-direction:row;align-items:center;}
  .field label{font-size:12.5px;color:var(--muted);}
  .field.inline label{color:var(--text);display:flex;align-items:center;gap:6px;cursor:pointer;}
  input[type=number],select,textarea{
    background:#12161e;border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:8px 10px;font-family:inherit;font-size:13px;width:100%;
    outline:none;
  }
  input[type=number]:focus,select:focus,textarea:focus{border-color:var(--accent);}
  textarea{resize:vertical;line-height:1.6;}
  input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;}
  .setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px;}
  .role-item{display:flex;flex-direction:column;gap:4px;}
  .role-item span{font-size:12px;color:var(--muted);}
  .sub-label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  .btn-row{margin-top:6px;}
  .btn-row button{width:100%;padding:11px;}
  /* ---------- 投票 ---------- */
  .vote-list{display:flex;flex-direction:column;gap:6px;margin:10px 0 14px;}
  .vote-row{display:flex;align-items:center;gap:10px;}
  .vote-row .vn{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .vote-row select{width:auto;min-width:130px;flex:0 0 auto;}
  .vote-row em{color:var(--muted);font-style:normal;font-size:11px;}
  .tally-list{display:flex;flex-direction:column;gap:4px;margin:8px 0 14px;}
  .tally-row{display:flex;justify-content:space-between;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;}
  /* ---------- 复盘 ---------- */
  .reveal-list{display:flex;flex-direction:column;gap:5px;margin:14px 0;}
  .reveal-row{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;}
  .reveal-row span:first-child{flex:1;}
  /* ---------- 日志 ---------- */
  .log-list{display:flex;flex-direction:column;gap:4px;font-size:12.5px;}
  .log-item{
    display:flex;gap:8px;padding:5px 8px;border-radius:7px;
    background:#13171f;border-left:2px solid var(--line);color:#c7cedd;
  }
  .log-item .lt{color:#5d6879;font-variant-numeric:tabular-nums;flex:0 0 auto;}
  .log-item.wolf{border-left-color:#ff5d6c;}
  .log-item.seer{border-left-color:#5b8def;}
  .log-item.witch{border-left-color:#7c5cff;}
  .log-item.hunter{border-left-color:#ffb454;}
  .log-item.death{border-left-color:#ff5d6c;background:#1c1419;}
  .log-item.phase{border-left-color:#3ddc97;color:#a9f0d0;font-weight:600;}
  .log-item.result{border-left-color:#ffb454;color:#ffd79a;font-weight:700;}
  /* ---------- 结束 ---------- */
  .win-title{font-size:22px;font-weight:800;text-align:center;padding:18px 0;}
  .win-title.good{color:var(--good);}
  .win-title.bad{color:var(--bad);}
  /* ---------- 响应式 ---------- */
  @media(max-width:1000px){
    .layout{grid-template-columns:1fr;}
    .panel{max-height:none;}
  }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#2a3346;border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🐺 狼人杀 · 上帝助手</div>
  <div class="status" id="statusBar"></div>
  <div class="top-actions">
    <button id="btnUndo" title="撤销上一步操作">↶ 撤销</button>
    <button id="btnExport" title="导出文本日志">导出日志</button>
    <button id="btnReset" class="danger" title="清空当前对局">重置</button>
  </div>
</header>

<main class="layout">
  <aside class="panel" id="playersPanel"></aside>
  <section class="panel" id="actionPanel"></section>
  <aside class="panel" id="logPanel"></aside>
</main>

<script>
/* =========================================================================
 * 狼人杀 · 上帝辅助工具（单文件本地版）
 * 仅使用原生 HTML/CSS/JS，数据保存在 localStorage。
 * ========================================================================= */

/* ------------------------- 常量与静态数据 ------------------------- */
const STORAGE_KEY = 'wolfgod_state_v1';
const MAX_UNDO = 30;

// 角色定义表（新增角色只需在此登记并补充流程分支）
const ROLE_DEFS = {
  wolf:     { name: '狼人',   camp: 'wolf' },
  villager: { name: '平民',   camp: 'good' },
  seer:     { name: '预言家', camp: 'good' },
  witch:    { name: '女巫',   camp: 'good' },
  hunter:   { name: '猎人',   camp: 'good' },
  idiot:    { name: '白痴',   camp: 'good' }
};
const GOD_ROLES = ['seer', 'witch', 'hunter', 'idiot'];

// 板子预设
const PRESETS = {
  '12y': { playerCount: 12, roles: { wolf: 4, villager: 4, seer: 1, witch: 1, hunter: 1, idiot: 1 } },
  '9y':  { playerCount: 9,  roles: { wolf: 3, villager: 3, seer: 1, witch: 1, hunter: 1, idiot: 0 } }
};

/* ------------------------- 全局状态 ------------------------- */
let state = freshState();

function freshState() {
  return {
    config: {
      playerCount: 12,
      roles: { wolf: 4, villager: 4, seer: 1, witch: 1, hunter: 1, idiot: 1 },
      hasSheriff: true,
      winMode: 'side'           // side=屠边, all=屠城
    },
    players: [],                // {id,seat,name,role,alive,isSheriff,...}
    phase: 'setup',             // setup | night | day | over
    step: 'setup',              // 细分流程步骤
    day: 0,
    night: 0,
    nightInfo: { wolfTarget: null, seerTarget: null, seerResult: null, witchSaved: false, witchPoison: null, deaths: [] },
    lastNightDeaths: [],
    sheriffId: null,
    hideRoles: false,           // 上帝视角：是否隐藏身份显示
    pendingHunter: null,        // 待开枪的猎人 id
    voteChoices: {},            // 投票人 id -> 目标 id
    voteResult: null,           // {counts, top}
    logs: [],
    undoStack: [],
    winner: null
  };
}

/* ------------------------- 通用工具函数 ------------------------- */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function getP(id) { return state.players.find(p => p.id === Number(id)) || null; }
function alivePlayers() { return state.players.filter(p => p.alive); }
function nameOf(id) { const p = getP(id); return p ? `${p.seat}号 ${p.name}` : '未知'; }
function isGod(role) { return GOD_ROLES.includes(role); }
function fmtTime(t) {
  const d = new Date(t);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

/* ------------------------- 持久化 ------------------------- */
function save() {
  try {
    // 撤销栈不写入本地，避免体积过大
    const clone = Object.assign({}, state, { undoStack: [] });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(clone));
  } catch (e) {
    console.warn('本地存储写入失败：', e);
  }
}

/* ------------------------- 撤销栈 ------------------------- */
function snapshot() {
  return JSON.stringify(Object.assign({}, state, { undoStack: [] }));
}
function pushUndo() {
  state.undoStack.push(snapshot());
  if (state.undoStack.length > MAX_UNDO) state.undoStack.shift();
}
function undo() {
  if (!state.undoStack.length) { alert('没有可撤销的操作了。'); return; }
  const stack = state.undoStack;
  const prev = JSON.parse(stack.pop());
  prev.undoStack = stack;
  state = prev;
  render();
}

/* ------------------------- 日志 ------------------------- */
function log(text, type = 'info') {
  state.logs.push({ t: Date.now(), day: state.day, night: state.night, phase: state.phase, text, type });
}

/* =========================================================================
 * 游戏流程控制
 * ========================================================================= */

// 开始一个夜晚
function startNight() {
  state.night += 1;
  state.phase = 'night';
  state.nightInfo = { wolfTarget: null, seerTarget: null, seerResult: null, witchSaved: false, witchPoison: null, deaths: [] };
  state.voteChoices = {};
  state.voteResult = null;
  state.step = 'night_wolf';
  log(`—— 第 ${state.night} 夜 · 天黑请闭眼 ——`, 'phase');
}

// 狼人行动结束后
function nextAfterWolf() {
  const seer = state.players.find(p => p.role === 'seer' && p.alive);
  if (seer) state.step = 'night_seer';
  else nextAfterSeer();
}

// 预言家行动结束后
function nextAfterSeer() {
  const witch = state.players.find(p => p.role === 'witch' && p.alive);
  if (witch && (!witch.witchHealUsed || !witch.witchPoisonUsed)) state.step = 'night_witch';
  else afterWitch();
}

// 女巫行动结束后：结算夜晚死亡
function afterWitch() {
  const wi = state.nightInfo;
  const deaths = [];
  if (wi.wolfTarget && !wi.witchSaved) deaths.push(wi.wolfTarget);
  if (wi.witchPoison && !deaths.includes(wi.witchPoison)) deaths.push(wi.witchPoison);
  wi.deaths = deaths;

  deaths.forEach(id => { const p = getP(id); if (p) p.alive = false; });
  deaths.forEach(id => log(`${nameOf(id)} 死亡`, 'death'));
  state.lastNightDeaths = deaths.slice();

  // 胜负判定
  const w = checkWin();
  if (w) { endGame(w); return; }

  // 猎人夜间死亡（非毒杀）可开枪
  const hunter = state.players.find(p => p.role === 'hunter');
  if (hunter && deaths.includes(hunter.id) && wi.witchPoison !== hunter.id && !hunter.hunterShotUsed) {
    state.pendingHunter = hunter.id;
    state.step = 'night_hunter';
    return;
  }
  startDay();
}

// 开始白天
function startDay() {
  state.day += 1;
  state.phase = 'day';
  state.step = 'day_start';
  log(`—— 第 ${state.day} 天 · 天亮了 ——`, 'phase');
}

// 胜负判定
function checkWin() {
  const alive = alivePlayers();
  const wolvesAlive = alive.filter(p => p.role === 'wolf').length;
  if (wolvesAlive === 0) return 'good';

  const totalGods = state.players.filter(p => isGod(p.role)).length;
  const totalVillagers = state.players.filter(p => p.role === 'villager').length;

  if (state.config.winMode === 'all') {
    // 屠城：好人全部出局
    const goodAlive = alive.filter(p => p.role !== 'wolf').length;
    if (goodAlive === 0) return 'wolf';
  } else {
    // 屠边：神职全灭 或 平民全灭
    const godsAlive = alive.filter(p => isGod(p.role)).length;
    const villAlive = alive.filter(p => p.role === 'villager').length;
    if (totalGods > 0 && godsAlive === 0) return 'wolf';
    if (totalVillagers > 0 && villAlive === 0) return 'wolf';
  }
  return null;
}

function endGame(winner) {
  state.phase = 'over';
  state.step = 'over';
  state.winner = winner;
  log(winner === 'good' ? '🎉 好人阵营胜利！' : '🐺 狼人阵营胜利！', 'result');
}

/* =========================================================================
 * 渲染层
 * ========================================================================= */
function render() {
  renderTopbar();
  renderPlayers();
  const el = document.getElementById('actionPanel');
  if (state.step !== 'setup') el.dataset.built = '';
  renderAction(el);
  renderLogs();
  document.getElementById('btnUndo').disabled = state.undoStack.length === 0;
  save();
}

function renderTopbar() {
  const el = document.getElementById('statusBar');
  let phaseText = '准备阶段';
  if (state.phase === 'night') phaseText = `🌙 第 ${state.night} 夜`;
  else if (state.phase === 'day') phaseText = `☀️ 第 ${state.day} 天`;
  else if (state.phase === 'over') phaseText = '🏁 对局结束';

  const aliveCount = state.players.filter(p => p.alive).length;
  const total = state.players.length;
  el.innerHTML = `
    <span class="chip">${phaseText}</span>
    ${total ? `<span class="chip muted">存活 ${aliveCount} / ${total}</span>` : ''}
    ${state.sheriffId && getP(state.sheriffId) && getP(state.sheriffId).alive
      ? `<span class="chip muted">👑 警长：${escapeHtml(getP(state.sheriffId).name)}</span>` : ''}
  `;
}

function renderPlayers() {
  const el = document.getElementById('playersPanel');
  if (!state.players.length) {
    el.innerHTML = `<div class="panel-head"><h2>玩家席</h2></div>
      <p class="muted small">尚未分配身份。请在右侧完成「游戏设置」后开始游戏。</p>`;
    return;
  }
  const alive = state.players.filter(p => p.alive).length;
  let html = `
    <div class="panel-head">
      <h2>玩家席</h2>
      <button class="mini" id="toggleRoles">${state.hideRoles ? '👁 显示身份' : '🙈 隐藏身份'}</button>
    </div>
    <p class="muted small">存活 ${alive} / ${state.players.length}</p>
    <div class="player-list">`;

  state.players.forEach(p => {
    html += `
      <div class="player-card ${p.alive ? '' : 'dead'} ${p.isSheriff ? 'sheriff' : ''}">
        <span class="p-seat">${p.seat}</span>
        <span class="p-name">${escapeHtml(p.name)}</span>
        ${state.hideRoles ? '' : `<span class="role-tag role-${p.role}">${ROLE_DEFS[p.role].name}</span>`}
        ${p.isSheriff ? '<span class="badge" title="警长">👑</span>' : ''}
        ${p.idiotRevealed ? '<span class="badge" title="白痴已翻牌">🃏</span>' : ''}
        ${p.alive ? '' : '<span class="badge" title="已出局">💀</span>'}
      </div>`;
  });
  html += `</div>`;
  el.innerHTML = html;

  el.querySelector('#toggleRoles').onclick = () => {
    state.hideRoles = !state.hideRoles;
    render();
  };
}

function renderLogs() {
  const el = document.getElementById('logPanel');
  const items = state.logs.slice().reverse();
  el.innerHTML = `
    <h2>操作日志</h2>
    <div class="log-list">
      ${items.length ? items.map(l =>
        `<div class="log-item ${l.type}"><span class="lt">${fmtTime(l.t)}</span><span>${escapeHtml(l.text)}</span></div>`
      ).join('') : '<p class="muted small">暂无日志</p>'}
    </div>`;
}

/* ------------------------- 目标选择网格 ------------------------- */
function grid(players) {
  return `<div class="target-grid">` + players.map(p => `
    <button class="target-btn" data-pid="${p.id}">
      <span class="tb-seat">${p.seat}</span>
      <span class="tb-name">${escapeHtml(p.name)}</span>
    </button>`).join('') + `</div>`;
}
function bindGrid(root, cb) {
  root.querySelectorAll('.target-btn').forEach(btn => {
    btn.onclick = () => cb(Number(btn.dataset.pid));
  });
}

/* ------------------------- 操作面板主分发 ------------------------- */
function renderAction(el) {
  switch (state.step) {
    case 'setup':        return renderSetup(el);
    case 'night_wolf':   return renderNightWolf(el);
    case 'night_seer':   return renderNightSeer(el);
    case 'night_witch':  return renderNightWitch(el);
    case 'night_hunter': return renderHunter(el, 'night');
    case 'day_start':    return renderDayStart(el);
    case 'day_sheriff':  return renderDaySheriff(el);
    case 'day_vote':     return renderDayVote(el);
    case 'day_hunter':   return renderHunter(el, 'day');
    case 'day_end':      return renderDayEnd(el);
    case 'over':         return renderOver(el);
    default:
      el.innerHTML = `<h2>等待中</h2><p class="muted">请按流程操作。</p>`;
  }
}

        <option value="all" ${state.config.winMode === 'all' ? 'selected' : ''}>屠城（杀光全部好人才胜）</option>
      </select>
    </div>

    <div class="field">

      <textarea id="namesTa" rows="7"></textarea>

    document.querySelectorAll('#roleGrid input').forEach(i => {
      i.value = state.config.roles[i.dataset.role] || 0;
    });
    syncNameRows(p.playerCount);

  };

  document.getElementById('playerCount').onchange = (e) => {
    const v = Math.max(4, Math.min(24, Number(e.target.value) || 4));
    state.config.playerCount = v;
    e.target.value = v;
    syncNameRows(v);
    updateSetupSummary();
  };

  document.querySelectorAll('#roleGrid input').forEach(i => {
    i.onchange = () => updateSetupSummary();
  });

  document.getElementById('hasSheriff').onchange = (e) => {
    state.config.hasSheriff = e.target.checked;
    save();
  };
  document.getElementById('winMode').onchange = (e) => {

// 同步昵称文本域行数
function syncNameRows(count) {
  const ta = document.getElementById('namesTa');
  if (!ta) return;
  const lines = ta.value.split('\n').map(s => s.trim());
  const out = [];
  for (let i = 0; i < count; i++) out.push(lines[i] || `玩家${i + 1}`);
  ta.value = out.join('\n');
}

// 更新设置校验提示
function updateSetupSummary() {
  const gridEl = document.getElementById('roleGrid');
  const hint = document.getElementById('roleHint');
  const btn = document.getElementById('btnStart');
  if (!gridEl || !hint || !btn) return;

  const roles = {};
  let sum = 0;
  gridEl.querySelectorAll('input').forEach(i => {
    const v = Math.max(0, Number(i.value) || 0);
    roles[i.dataset.role] = v;
    sum += v;
  });
  state.config.roles = roles;

  const pc = Number(document.getElementById('playerCount').value) || 0;
  state.config.playerCount = pc;

  const ok = sum === pc && pc >= 4 && roles.wolf >= 1;
  let msg = `当前角色合计 ${sum} 人，目标 ${pc} 人。`;
  if (sum !== pc) msg += ' ❌ 人数不匹配，请调整角色数量。';
  else if (roles.wolf < 1) msg += ' ❌ 至少需要 1 名狼人。';
  else msg += ' ✅ 配置正确，可以开始。';

  hint.textContent = msg;
  hint.className = 'hint ' + (ok ? 'ok' : 'err');
  btn.disabled = !ok;
}

// 开始游戏：校验 → 分配身份 → 进入第一夜
function startGame() {
  const roles = state.config.roles;
  const pc = state.config.playerCount;
  let sum = 0;
  Object.values(roles).forEach(v => sum += v);

  if (sum !== pc) { alert(`角色合计 ${sum} 人不等于玩家 ${pc} 人，请调整后再开始。`); return; }
  if (roles.wolf < 1) { alert('至少需要 1 名狼人。'); return; }

  // 处理昵称
  const raw = document.getElementById('namesTa').value.split('\n').map(s => s.trim());
  const used = new Set();
  const names = [];
  for (let i = 0; i < pc; i++) {
    let base = raw[i] || `玩家${i + 1}`;
    let name = base, k = 1;
    while (used.has(name)) { k++; name = base + k; }
    used.add(name);
    names.push(name);
  }

  // 生成身份池并随机
  const pool = [];
  Object.keys(roles).forEach(r => { for (let i = 0; i < roles[r]; i++) pool.push(r); });
  shuffle(pool);

  state.players = names.map((name, idx) => ({
    id: idx + 1,
    seat: idx + 1,
    name,
    role: pool[idx],
    alive: true,
    isSheriff: false,
    idiotRevealed: false,
    witchHealUsed: false,
    witchPoisonUsed: false,
    hunterShotUsed: false,
    canVote: true
  }));

  // 重置对局数据
  state.sheriffId = null;
  state.day = 0;
  state.night = 0;
  state.logs = [];
  state.undoStack = [];
  state.winner = null;
  state.voteChoices = {};
  state.voteResult = null;
  state.lastNightDeaths = [];
  state.hideRoles = false;
  state.pendingHunter = null;

  log('游戏开始，身份已随机分配。', 'phase');
  log('角色配置：' + Object.keys(roles)
    .filter(r => roles[r] > 0)
    .map(r => `${ROLE_DEFS[r].name}×${roles[r]}`).join('，'), 'phase');

  startNight();
  render();
}

/* =========================================================================
 * 步骤：夜晚 · 女巫
 * ========================================================================= */
function renderNightWitch(el) {
  const witch = state.players.find(p => p.role === 'witch');
  const wi = state.nightInfo;
  const wolfTarget = wi.wolfTarget ? getP(wi.wolfTarget) : null;
  const canHeal = !witch.witchHealUsed && !!wolfTarget;
  const canPoison = !witch.witchPoisonUsed;

  let html = `<h2>第 ${state.night} 夜 · 女巫用药</h2>
    <p class="hint">今晚狼人击杀目标：<b>${wolfTarget ? `${wolfTarget.seat}号 ${escapeHtml(wolfTarget.name)}` : '空刀'}</b></p>`;

  if (canHeal) {
    html += `<button class="primary" id="heal" style="width:100%">🧪 使用解药救 ${escapeHtml(wolfTarget.name)}</button>`;
  } else if (witch.witchHealUsed) {
    html += `<p class="hint">（解药已使用）</p>`;
  }

  if (canPoison) {
    html += `<p class="hint" style="margin-top:14px">☠️ 使用毒药（选择目标，女巫不可毒自己）：</p>`;
    html += grid(alivePlayers().filter(p => p.id !== witch.id));
  } else {
    html += `<p class="hint" style="margin-top:14px">（毒药已使用）</p>`;
  }

  html += `<button class="ghost" id="skip" style="margin-top:6px">不使用药水 / 跳过</button>`;
  el.innerHTML = html;

  // 解药
  const healBtn = el.querySelector('#heal');
  if (healBtn) {
    healBtn.onclick = () => {
      pushUndo();
      witch.witchHealUsed = true;
      state.nightInfo.witchSaved = true;
      log(`女巫使用解药救了 ${nameOf(wolfTarget.id)}`, 'witch');
      afterWitch();
      render();
    };
  }

  // 毒药
  if (canPoison) {
    bindGrid(el, (id) => {
      pushUndo();
      witch.witchPoisonUsed = true;
      state.nightInfo.witchPoison = id;
      log(`女巫使用毒药毒杀 ${nameOf(id)}`, 'witch');
      afterWitch();
      render();
    });
  }

  // 跳过
  el.querySelector('#skip').onclick = () => {
    pushUndo();
    log('女巫不使用药水', 'witch');
    afterWitch();
    render();
  };
}

function renderHunter(el, ctx) {
  const h = getP(state.pendingHunter);
  if (!h) { state.step = ctx === 'night' ? 'day_start' : 'day_end'; return renderAction(el); }

  el.innerHTML = `
    <h2>猎人开枪</h2>
    <p class="hint">猎人 <b>${h.seat}号 ${escapeHtml(h.name)}</b> 出局，可开枪带走一名玩家。</p>
    ${grid(alivePlayers())}
    <button class="ghost" id="noShot">放弃开枪</button>
  `;

  bindGrid(el, (id) => {
    pushUndo();
    h.hunterShotUsed = true;
    const t = getP(id);
    t.alive = false;
    log(`猎人 ${h.name} 开枪带走 ${nameOf(id)}`, 'hunter');

/* =========================================================================
 * 步骤：白天 · 天亮公布
 * ========================================================================= */
function renderDayStart(el) {
  const deaths = state.lastNightDeaths || [];
  let html = `<h2>第 ${state.day} 天 · 天亮</h2>`;
  html += `<p class="death-line">${deaths.length
    ? '昨夜死亡：' + deaths.map(nameOf).join('、')
    : '🌤 平安夜，无人死亡'}</p>`;

  const sheriff = state.sheriffId ? getP(state.sheriffId) : null;

  if (sheriff && !sheriff.alive) {
    // 警长死亡 → 移交警徽
    html += `<p class="hint">警长 <b>${escapeHtml(sheriff.name)}</b> 已死亡，请选择警徽移交给谁：</p>`;
    html += grid(alivePlayers());
    html += `<button class="ghost" id="lostBadge">警徽流失（无人继任）</button>`;
    el.innerHTML = html;

    bindGrid(el, (id) => {
      pushUndo();
      const np = getP(id);
      sheriff.isSheriff = false;
      np.isSheriff = true;
      state.sheriffId = id;
      log(`警徽移交给 ${nameOf(id)}`, 'phase');
      render();
    });
    el.querySelector('#lostBadge').onclick = () => {
      pushUndo();
      sheriff.isSheriff = false;
      state.sheriffId = null;
      log('警徽流失，本局无警长', 'phase');
      render();
    };
    return;
  }

  if (state.day === 1 && state.config.hasSheriff && !state.sheriffId) {
    html += `<button class="primary" id="next" style="width:100%">开始警长竞选</button>`;
  } else {
    html += `<button class="primary" id="next" style="width:100%">进入投票放逐</button>`;
  }
  el.innerHTML = html;

  el.querySelector('#next').onclick = () => {
    pushUndo();
    state.step = (state.day === 1 && state.config.hasSheriff && !state.sheriffId)
      ? 'day_sheriff' : 'day_vote';

/* =========================================================================

/* =========================================================================
 * 步骤：白天 · 投票放逐
 * ========================================================================= */
function renderDayVote(el) {
  const alive = alivePlayers();

  // 初始化投票选择容器
  alive.forEach(p => { if (!(p.id in state.voteChoices)) state.voteChoices[p.id] = ''; });

  let html = `<h2>第 ${state.day} 天 · 投票放逐</h2>`;

  if (state.voteResult) {
    // ---- 已统计，展示结果并确认放逐 ----
    const { counts, top } = state.voteResult;
    html += `<p class="hint">票数统计：</p><div class="tally-list">`;
    const ids = Object.keys(counts);
    if (!ids.length) {
      html += `<div class="tally-row"><span>全场弃票</span><b>0 票</b></div>`;
    } else {
      ids.sort((a, b) => counts[b] - counts[a]).forEach(id => {
        html += `<div class="tally-row"><span>${nameOf(id)}</span><b>${counts[id]} 票</b></div>`;
      });
    }
    html += `</div>`;

    if (top && top.length) {
      html += `<p class="hint">${top.length === 1 ? '最高票' : '出现平票'}：${top.map(nameOf).join('、')}。请点击确认放逐对象：</p>`;
      html += grid(top.map(getP));
    } else {
      html += `<p class="hint">全场弃票，本轮无人出局。</p>
        <button class="primary" id="skipExile" style="width:100%">进入白天结算</button>`;
    }
  } else {
    // ---- 投票录入 ----
    html += `<p class="hint">为每位存活玩家选择投票对象，然后点击「统计票数」。</p><div class="vote-list">`;
    alive.forEach(p => {
      const noVote = p.canVote === false;
      html += `<div class="vote-row">
        <span class="vn">${p.seat}号 ${escapeHtml(p.name)}${p.isSheriff ? ' 👑' : ''}${noVote ? ' <em>(无投票权)</em>' : ''}</span>
        <select data-voter="${p.id}" ${noVote ? 'disabled' : ''}>
          <option value="">弃票</option>
          ${alive.filter(q => q.id !== p.id).map(q =>
            `<option value="${q.id}" ${String(state.voteChoices[p.id]) === String(q.id) ? 'selected' : ''}>${q.seat}号 ${escapeHtml(q.name)}</option>`
          ).join('')}
        </select>
      </div>`;
    });
    html += `</div><button class="primary" id="tally" style="width:100%">统计票数</button>`;
  }

  el.innerHTML = html;

  // ---- 事件绑定 ----
  if (state.voteResult) {
    const top = state.voteResult.top;
    if (top && top.length) {
      bindGrid(el, (id) => exile(id));
    } else {
      const b = el.querySelector('#skipExile');
      if (b) b.onclick = () => { pushUndo(); state.step = 'day_end'; render(); };
    }
  } else {
    // 记录选择
    el.querySelectorAll('select[data-voter]').forEach(sel => {
      sel.onchange = () => { state.voteChoices[sel.dataset.voter] = sel.value; save(); };
    });
    el.querySelector('#tally').onclick = tallyVotes;
  }
}

// 统计票数
function tallyVotes() {
  pushUndo();
  const counts = {};
  alivePlayers().forEach(p => {
    if (p.canVote === false) return;
    const t = state.voteChoices[p.id];
    if (t) {
      const tid = Number(t);
      counts[tid] = (counts[tid] || 0) + 1;
    }
  });

  const values = Object.values(counts);
  const max = values.length ? Math.max(...values) : 0;
  const top = max > 0 ? Object.keys(counts).filter(k => counts[k] === max).map(Number) : [];
  state.voteResult = { counts, top };

  log('投票统计：' + (Object.keys(counts).length
    ? Object.keys(counts).map(id => `${nameOf(id)} ${counts[id]}票`).join('，')
    : '全场弃票'), 'vote');

  render();
}

// 放逐结算
function exile(id) {
  pushUndo();
  const p = getP(id);
  log(`投票结果：${nameOf(id)} 被放逐出局`, 'vote');

  // 白痴翻牌
  if (p.role === 'idiot' && !p.idiotRevealed) {
    p.idiotRevealed = true;
    p.canVote = false;
    log('白痴翻牌，免于放逐，但失去投票权 🃏', 'skill');
    state.step = 'day_end';
    render();
    return;
  }

  p.alive = false;
  p.canVote = false;

  // 猎人被放逐可开枪
  if (p.role === 'hunter' && !p.hunterShotUsed) {
    state.pendingHunter = p.id;
    state.step = 'day_hunter';
    render();
    return;
  }

  const w = checkWin();
  if (w) { endGame(w); render(); return; }

  state.step = 'day_end';
  render();
}

/* =========================================================================
 * 步骤：白天结束

function renderDayEnd(el) {

    <p class="hint">请处理出局玩家遗言与警徽归属，然后进入夜晚。</p>
    <button class="primary" id="next" style="width:100%">天黑请闭眼 · 进入第 ${state.day + 1} 夜</button>
  `;

    pushUndo();
    startNight();

/* =========================================================================
 * 步骤：对局结束
 * ========================================================================= */
function renderOver(el) {
  const rows = state.players.map(p => `
    <div class="reveal-row">
      <span>${p.seat}号 ${escapeHtml(p.name)}</span>
      <span class="role-tag role-${p.role}">${ROLE_DEFS[p.role].name}</span>
      <span class="muted">${p.alive ? '存活' : '出局'}</span>
    </div>`).join('');

  el.innerHTML = `
    <div class="win-title ${state.winner === 'good' ? 'good' : 'bad'}">
      ${state.winner === 'good' ? '🎉 好人阵营胜利' : '🐺 狼人阵营胜利'}
    </div>
    <p class="hint">全部身份揭晓：</p>
    <div class="reveal-list">${rows}</div>
    <div class="btn-row">
      <button class="danger" id="again" style="width:100%">重置并开始新对局</button>
    </div>
  `;
  el.querySelector('#again').onclick = () => {
    if (confirm('确定要重置当前对局吗？所有记录将被清空。')) resetGame();
  };
}

/* =========================================================================
 * 全局操作：重置 / 导出
 * ========================================================================= */
function resetGame() {
  localStorage.removeItem(STORAGE_KEY);
  state = freshState();
  const el = document.getElementById('actionPanel');
  el.dataset.built = '';
  render();
}

function exportLogs() {
  if (!state.logs.length) { alert('当前没有日志可导出。'); return; }

  const cfg = state.config.roles;
  const header = [
    '狼人杀对局记录',
    '生成时间：' + new Date().toLocaleString(),
    '板子：' + Object.keys(cfg).filter(r => cfg[r] > 0).map(r => `${ROLE_DEFS[r].name}×${cfg[r]}`).join('，'),
    '警长：' + (state.config.hasSheriff ? '启用' : '未启用'),
    '胜负判定：' + (state.config.winMode === 'side' ? '屠边' : '屠城'),
    state.winner ? ('结果：' + (state.winner === 'good' ? '好人阵营胜利' : '狼人阵营胜利')) : '结果：对局进行中',
    '----------------------------------------'
  ].join('\n');

  const body = state.logs.map(l => {
    const d = new Date(l.t);
    const ts = String(d.getHours()).padStart(2, '0') + ':' +
               String(d.getMinutes()).padStart(2, '0') + ':' +
               String(d.getSeconds()).padStart(2, '0');
    return `[${ts}] ${l.text}`;
  }).join('\n');

  const blob = new Blob([header + '\n' + body], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `狼人杀日志_${new Date().toISOString().slice(0, 10)}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* =========================================================================
 * 初始化：读取本地存档 / 新建
 * ========================================================================= */
function init() {
  const raw = localStorage.getItem(STORAGE_KEY);
  let loaded = null;

  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.players)) {
        throw new Error('数据结构异常');
      }
      loaded = parsed;
    } catch (e) {
      console.warn('本地存档损坏：', e);
      localStorage.removeItem(STORAGE_KEY);
      alert('检测到本地存档损坏，已重置为新对局。');
      loaded = null;
    }
  }

  if (loaded) {
    state = Object.assign(freshState(), loaded);
    // 补齐可能缺失的嵌套字段
    state.config = Object.assign(freshState().config, state.config || {});
    state.nightInfo = Object.assign(
      { wolfTarget: null, seerTarget: null, seerResult: null, witchSaved: false, witchPoison: null, deaths: [] },
      state.nightInfo || {}
    );
    state.undoStack = [];
    state.logs = state.logs || [];
    if (!state.players.length) state.step = 'setup';
  } else {
    state = freshState();
  }

  // 绑定顶栏按钮
  document.getElementById('btnUndo').onclick = undo;
  document.getElementById('btnExport').onclick = exportLogs;
  document.getElementById('btnReset').onclick = () => {
    if (confirm('确定要重置当前对局吗？所有记录将被清空，且无法恢复。')) resetGame();
  };

  // 快捷键：Ctrl/Cmd + Z 撤销
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      undo();
    }
  });

  render();
}

init();
</script>
