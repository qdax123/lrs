<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>狼人杀 · 上帝助手</title>
<style>
  /* =====================================================================
     移动端优先 · 狼人杀上帝助手样式
     布局：固定顶栏 + 滚动内容区 + 固定底部标签栏（拇指可达）
     ===================================================================== */
  :root{
    --bg:#0e1014;
    --panel:#161a22;
    --panel-2:#1d2230;
    --panel-3:#232a3a;
    --line:#28303f;
    --text:#e7eaf3;
    --muted:#8b95a8;
    --accent:#5b8def;
    --accent-2:#7c5cff;
    --good:#3ddc97;
    --bad:#ff5d6c;
    --warn:#ffb454;
    --tab-h:62px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:radial-gradient(900px 420px at 15% -8%, #1a2030 0%, var(--bg) 62%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px;
    line-height:1.55;
    overscroll-behavior:none;
  }
  button,select,input,textarea{
    font-family:inherit;
    -webkit-tap-highlight-color:transparent;
  }
  /* 全局触控优化：避免双击缩放、保证最小点击区域 */
  button{touch-action:manipulation;}
  /* ---------- 顶栏 ---------- */
  .appbar{
    flex:0 0 auto;
    background:rgba(22,26,34,.94);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    padding-top:env(safe-area-inset-top);
    z-index:20;
  }
  .appbar-main{
    display:flex;align-items:center;gap:10px;
    height:52px;padding:0 12px;
  }
  .brand{
    font-weight:800;font-size:16px;letter-spacing:.4px;
    white-space:nowrap;flex:1;
    overflow:hidden;text-overflow:ellipsis;
  }
  .icon-btn{
    width:42px;height:42px;
    display:flex;align-items:center;justify-content:center;
    padding:0;font-size:17px;border-radius:12px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
  }
  .icon-btn:disabled{opacity:.35;}
  .status-strip{
    display:flex;gap:8px;align-items:center;
    padding:0 12px 9px;
    overflow-x:auto;white-space:nowrap;
    scrollbar-width:none;
  }
  .status-strip::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    background:var(--panel-2);border:1px solid var(--line);
    padding:4px 11px;border-radius:999px;font-size:12.5px;
  }
  .chip.muted{color:var(--muted);}
  /* ---------- 内容区 ---------- */
  .viewport{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    padding:14px 12px 24px;
  }
  .viewport-inner{
    width:100%;max-width:600px;margin:0 auto;
  }
  .view{display:block;}
  .view[hidden]{display:none;}
  /* ---------- 底部标签栏 ---------- */
  .tabbar{
    flex:0 0 auto;
    display:flex;
    border-top:1px solid var(--line);
    background:rgba(22,26,34,.97);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    padding-bottom:env(safe-area-inset-bottom);
    z-index:20;
  }
  .tab{
    flex:1;
    height:var(--tab-h);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    border:0;background:transparent;color:var(--muted);
    font-size:11.5px;border-radius:0;padding:0;
    position:relative;
  }
  .tab .tab-ico{font-size:19px;line-height:1;}
  .tab.active{color:var(--text);}
  .tab.active::after{
    content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:34px;height:3px;border-radius:0 0 4px 4px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
  }
  .tab:active{background:rgba(255,255,255,.04);}
  /* ---------- 通用卡片 / 标题 ---------- */
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:15px;
    margin-bottom:12px;
  }
  h2{font-size:16.5px;margin:0 0 10px;letter-spacing:.3px;}
  h3{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:600;}
  .muted{color:var(--muted);}
  .small{font-size:12.5px;}
  .hint{color:var(--muted);font-size:13px;margin:4px 0 12px;}
  .hint.ok{color:var(--good);}
  .hint.err{color:var(--bad);}
  /* ---------- 按钮 ---------- */
  button{
    font-size:15px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    padding:11px 16px;
    min-height:46px;
    cursor:pointer;
    transition:transform .08s ease, filter .15s ease, border-color .15s ease;
  }
  button:active:not(:disabled){transform:scale(.975);}
  button:disabled{opacity:.4;}
  button.primary{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    border-color:transparent;font-weight:700;color:#fff;
  }
  button.danger{border-color:#4a2630;color:var(--bad);}
  button.danger:active:not(:disabled){background:#2a1a20;}
  button.ghost{background:transparent;color:var(--muted);border-color:var(--line);}
  button.block{width:100%;}
  button.mini{min-height:38px;padding:8px 13px;font-size:13.5px;border-radius:10px;}
  /* ---------- 玩家席 ---------- */
  .player-list{display:flex;flex-direction:column;gap:8px;}
  .player-card{
    display:flex;align-items:center;gap:10px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:13px;
    padding:11px 13px;
    font-size:14.5px;
    min-height:52px;
  }
  .player-card.dead{opacity:.4;}
  .player-card.dead .p-name{text-decoration:line-through;}
  .player-card.sheriff{border-color:#6b5a1f;box-shadow:inset 0 0 0 1px rgba(255,196,84,.18);}
  .p-seat{
    flex:0 0 auto;
    min-width:26px;height:26px;border-radius:8px;
    background:#2a3346;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;color:var(--muted);
  }
  .p-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .badge{font-size:14px;flex:0 0 auto;}
  .role-tag{
    flex:0 0 auto;
    font-size:11.5px;padding:3px 9px;border-radius:999px;
    background:#2a3346;color:var(--muted);white-space:nowrap;font-weight:600;
  }
  .role-wolf{background:#3a1f27;color:#ff8b98;}
  .role-villager{background:#232b36;color:#9fb0c6;}
  .role-seer{background:#1e2f4a;color:#7fb4ff;}
  .role-witch{background:#2c2246;color:#b79bff;}
  .role-hunter{background:#3a2c1c;color:#ffbe72;}
  .role-idiot{background:#1f3a33;color:#6fe0b6;}
  /* ---------- 目标选择网格（2 列大按钮） ---------- */
  .target-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    margin:14px 0;
  }
  .target-btn{
    display:flex;align-items:center;gap:9px;
    padding:12px 12px;
    min-height:56px;
    border-radius:13px;
    font-size:14.5px;
    text-align:left;
    background:var(--panel-2);
    border:1px solid var(--line);
  }
  .target-btn:active{background:#26304a;border-color:var(--accent);}
  .tb-seat{
    flex:0 0 auto;
    min-width:24px;height:24px;border-radius:7px;
    background:#2a3346;
    display:flex;align-items:center;justify-content:center;
    font-size:11.5px;font-weight:800;color:var(--muted);
  }
  .tb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* ---------- 结果徽章 ---------- */
  .result-badge{
    padding:22px 16px;border-radius:16px;text-align:center;
    font-size:20px;font-weight:800;margin:14px 0;
    border:1px solid var(--line);background:var(--panel-2);
  }
  .result-badge.good{color:var(--good);border-color:#1f4a3a;background:#14261f;}
  .result-badge.bad{color:var(--bad);border-color:#4a2630;background:#261419;}
  .death-line{color:var(--bad);font-weight:700;font-size:15px;}
  .safe-line{color:var(--good);font-weight:700;font-size:15px;}
  /* ---------- 表单 ---------- */
  .field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
  .field.inline{flex-direction:row;align-items:center;}
  .field label{font-size:13.5px;color:var(--muted);}
  .field.inline label{
    color:var(--text);display:flex;align-items:center;gap:10px;
    cursor:pointer;font-size:14.5px;
  }
  input[type=number],select,textarea{
    background:#12161e;
    border:1px solid var(--line);
    color:var(--text);
    border-radius:12px;
    padding:12px 13px;
    font-size:16px;           /* ≥16px 防止 iOS 聚焦自动放大 */
    width:100%;
    min-height:48px;
    outline:none;
    appearance:none;
    -webkit-appearance:none;
  }
  select{
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                     linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 20px) 50%, calc(100% - 14px) 50%;
    background-size:6px 6px,6px 6px;
    background-repeat:no-repeat;
    padding-right:38px;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  textarea{resize:vertical;line-height:1.65;min-height:120px;}
  input[type=checkbox]{
    accent-color:var(--accent);width:20px;height:20px;flex:0 0 auto;
  }
  .setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  .role-item{display:flex;flex-direction:column;gap:6px;}
  .role-item span{font-size:13px;color:var(--muted);}
  .role-item input{text-align:center;}
  .sub-label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:9px;}
  /* ---------- 投票 ---------- */
  .vote-list{display:flex;flex-direction:column;gap:9px;margin:12px 0 16px;}
  .vote-row{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);
    gap:9px;align-items:center;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:13px;
    padding:9px 11px;
  }
  .vote-row .vn{
    font-size:13.5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .vote-row .vn em{color:var(--muted);font-style:normal;font-size:11.5px;}
  .vote-row select{min-height:42px;padding:8px 34px 8px 10px;font-size:15px;}
  .tally-list{display:flex;flex-direction:column;gap:7px;margin:10px 0 16px;}
  .tally-row{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--panel-2);border:1px solid var(--line);
    border-radius:11px;padding:10px 13px;font-size:14.5px;
  }
  .tally-row b{color:var(--warn);}
  /* ---------- 复盘 ---------- */
  .reveal-list{display:flex;flex-direction:column;gap:7px;margin:12px 0;}
  .reveal-row{
    display:flex;align-items:center;gap:10px;
    background:var(--panel-2);border:1px solid var(--line);
    border-radius:11px;padding:10px 12px;font-size:13.5px;
  }
  .reveal-row .rn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* ---------- 日志 ---------- */
  .log-list{display:flex;flex-direction:column;gap:6px;}
  .log-item{
    display:flex;gap:9px;
    padding:9px 11px;border-radius:11px;
    background:#13171f;
    border-left:3px solid var(--line);
    color:#c7cedd;font-size:13px;
  }
  .log-item .lt{
    color:#5d6879;font-variant-numeric:tabular-nums;flex:0 0 auto;font-size:12px;
  }
  .log-item.wolf{border-left-color:#ff5d6c;}
  .log-item.seer{border-left-color:#5b8def;}
  .log-item.witch{border-left-color:#7c5cff;}
  .log-item.hunter{border-left-color:#ffb454;}
  .log-item.vote{border-left-color:#9fb0c6;}
  .log-item.skill{border-left-color:#6fe0b6;}
  .log-item.death{border-left-color:#ff5d6c;background:#1c1419;}
  .log-item.phase{border-left-color:#3ddc97;color:#a9f0d0;font-weight:700;}
  .log-item.result{border-left-color:#ffb454;color:#ffd79a;font-weight:800;}
  /* ---------- 结束 ---------- */
  .win-title{
    font-size:24px;font-weight:900;text-align:center;
    padding:26px 0 10px;letter-spacing:1px;
  }
  .win-title.good{color:var(--good);}
  .win-title.bad{color:var(--bad);}
  /* ---------- 空状态 ---------- */
  .empty{
    text-align:center;color:var(--muted);
    padding:46px 20px;font-size:14px;line-height:1.9;
  }
  .empty .ico{font-size:38px;display:block;margin-bottom:10px;opacity:.6;}
  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 18px);
    transform:translateX(-50%) translateY(12px);
    background:rgba(38,46,64,.98);
    border:1px solid var(--line);
    color:var(--text);
    padding:11px 20px;
    border-radius:999px;
    font-size:13.5px;
    max-width:82vw;text-align:center;
    opacity:0;pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    z-index:100;
    box-shadow:0 8px 26px rgba(0,0,0,.5);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  /* ---------- 按钮组 ---------- */
  .btn-row{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .btn-row.row{flex-direction:row;}
  .btn-row.row button{flex:1;}
  /* ---------- 平板 / 桌面微调（仍为单列居中） ---------- */
  @media(min-width:620px){
    .viewport{padding:18px 18px 30px;}
    .target-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
    .role-grid{grid-template-columns:repeat(3,1fr);}
    .btn-row.row button{max-width:none;}
  }
  @media(min-width:900px){
    :root{--tab-h:66px;}
    .target-grid{grid-template-columns:repeat(4,minmax(0,1fr));}
  }
</style>
</head>
<body>

<!-- ===================== 顶栏 ===================== -->
<header class="appbar">
  <div class="appbar-main">
    <div class="brand">🐺 狼人杀 · 上帝助手</div>
    <button class="icon-btn" id="btnUndo" title="撤销上一步" aria-label="撤销上一步">↶</button>
  </div>
  <div class="status-strip" id="statusBar"></div>
</header>

<!-- ===================== 内容区 ===================== -->
<main class="viewport" id="viewport">
  <div class="viewport-inner">
    <section class="view" id="view-action"></section>
    <section class="view" id="view-players" hidden></section>
    <section class="view" id="view-logs" hidden></section>
  </div>
</main>

<!-- ===================== 底部标签栏 ===================== -->
<nav class="tabbar" role="tablist">
  <button class="tab active" data-tab="action" role="tab">
    <span class="tab-ico">🎯</span><span>操作台</span>
  </button>
  <button class="tab" data-tab="players" role="tab">
    <span class="tab-ico">👥</span><span>玩家</span>
  </button>
  <button class="tab" data-tab="logs" role="tab">
    <span class="tab-ico">📜</span><span>日志</span>
  </button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================================
 * 狼人杀 · 上帝辅助工具（移动端单文件版）
 * 纯原生 HTML5 + CSS3 + ES6，无外部依赖，数据存于 localStorage。
 * ========================================================================= */

/* ------------------------- 常量 ------------------------- */
const STORAGE_KEY = 'wolfgod_state_v2';
const MAX_UNDO = 30;
const TAB_H = 62;

// 角色登记表：新增角色只需在此登记，并在流程中补充分支
const ROLE_DEFS = {
  wolf:     { name: '狼人',   camp: 'wolf' },
  villager: { name: '平民',   camp: 'good' },
  seer:     { name: '预言家', camp: 'good' },
  witch:    { name: '女巫',   camp: 'good' },
  hunter:   { name: '猎人',   camp: 'good' },
  idiot:    { name: '白痴',   camp: 'good' }
};
const GOD_ROLES = ['seer', 'witch', 'hunter', 'idiot'];

// 板子预设
const PRESETS = {
  '12y': { playerCount: 12, roles: { wolf: 4, villager: 4, seer: 1, witch: 1, hunter: 1, idiot: 1 } },
  '9y':  { playerCount: 9,  roles: { wolf: 3, villager: 3, seer: 1, witch: 1, hunter: 1, idiot: 0 } }
};

/* ------------------------- 全局状态 ------------------------- */
let state = freshState();

function freshState() {
  return {
    config: {
      playerCount: 12,
      roles: { wolf: 4, villager: 4, seer: 1, witch: 1, hunter: 1, idiot: 1 },
      hasSheriff: true,
      winMode: 'side'            // side = 屠边, all = 屠城
    },
    players: [],                 // {id,seat,name,role,alive,isSheriff,...}
    phase: 'setup',              // setup | night | day | over
    step: 'setup',               // 细分流程步骤
    day: 0,
    night: 0,
    nightInfo: { wolfTarget: null, seerTarget: null, seerResult: null, witchSaved: false, witchPoison: null, deaths: [] },
    lastNightDeaths: [],
    sheriffId: null,
    hideRoles: false,
    pendingHunter: null,
    voteChoices: {},
    voteResult: null,
    logs: [],
    undoStack: [],
    winner: null
  };
}

/* ------------------------- 工具函数 ------------------------- */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function getP(id) { return state.players.find(p => p.id === Number(id)) || null; }
function alivePlayers() { return state.players.filter(p => p.alive); }
function nameOf(id) { const p = getP(id); return p ? `${p.seat}号 ${p.name}` : '未知'; }
function isGod(role) { return GOD_ROLES.includes(role); }
function fmtTime(t) {
  const d = new Date(t);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

/* ------------------------- 持久化 ------------------------- */
function save() {
  try {
    const clone = Object.assign({}, state, { undoStack: [] });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(clone));
  } catch (e) {
    console.warn('本地存储写入失败：', e);
  }
}

/* ------------------------- 撤销栈 ------------------------- */
function snapshot() {
  return JSON.stringify(Object.assign({}, state, { undoStack: [] }));
}
function pushUndo() {
  state.undoStack.push(snapshot());
  if (state.undoStack.length > MAX_UNDO) state.undoStack.shift();
}
function undo() {
  if (!state.undoStack.length) { toast('没有可撤销的操作'); return; }
  const stack = state.undoStack;
  const prev = JSON.parse(stack.pop());
  prev.undoStack = stack;
  state = prev;
  document.getElementById('view-action').dataset.built = '';
  toast('已撤销上一步');
  render();
}

/* ------------------------- 日志 ------------------------- */
function log(text, type = 'info') {
  state.logs.push({ t: Date.now(), text, type });
}

/* ------------------------- Toast ------------------------- */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

/* =========================================================================
 * 流程控制
 * ========================================================================= */

function startNight() {
  state.night += 1;
  state.phase = 'night';
  state.nightInfo = { wolfTarget: null, seerTarget: null, seerResult: null, witchSaved: false, witchPoison: null, deaths: [] };
  state.voteChoices = {};
  state.voteResult = null;
  state.step = 'night_wolf';
  log(`—— 第 ${state.night} 夜 · 天黑请闭眼 ——`, 'phase');
}

function nextAfterWolf() {
  const seer = state.players.find(p => p.role === 'seer' && p.alive);
  if (seer) state.step = 'night_seer';
  else nextAfterSeer();
}

function nextAfterSeer() {
  const witch = state.players.find(p => p.role === 'witch' && p.alive);
  if (witch && (!witch.witchHealUsed || !witch.witchPoisonUsed)) state.step = 'night_witch';
  else afterWitch();
}

// 女巫行动结束 → 结算夜间死亡
function afterWitch() {
  const wi = state.nightInfo;
  const deaths = [];
  if (wi.wolfTarget && !wi.witchSaved) deaths.push(wi.wolfTarget);
  if (wi.witchPoison && !deaths.includes(wi.witchPoison)) deaths.push(wi.witchPoison);
  wi.deaths = deaths;

  deaths.forEach(id => { const p = getP(id); if (p) p.alive = false; });
  deaths.forEach(id => log(`${nameOf(id)} 死亡`, 'death'));
  state.lastNightDeaths = deaths.slice();

  const w = checkWin();
  if (w) { endGame(w); return; }

  // 猎人夜间死亡且非被毒 → 可开枪
  const hunter = state.players.find(p => p.role === 'hunter');
  if (hunter && deaths.includes(hunter.id) && wi.witchPoison !== hunter.id && !hunter.hunterShotUsed) {
    state.pendingHunter = hunter.id;
    state.step = 'night_hunter';
    return;
  }
  startDay();
}

function startDay() {
  state.day += 1;
  state.phase = 'day';
  state.step = 'day_start';
  log(`—— 第 ${state.day} 天 · 天亮了 ——`, 'phase');
}

// 胜负判定：返回 'wolf' | 'good' | null
function checkWin() {
  const alive = alivePlayers();
  const wolvesAlive = alive.filter(p => p.role === 'wolf').length;
  if (wolvesAlive === 0) return 'good';

  if (state.config.winMode === 'all') {
    const goodAlive = alive.filter(p => p.role !== 'wolf').length;
    if (goodAlive === 0) return 'wolf';
  } else {
    const totalGods = state.players.filter(p => isGod(p.role)).length;
    const totalVill = state.players.filter(p => p.role === 'villager').length;
    const godsAlive = alive.filter(p => isGod(p.role)).length;
    const villAlive = alive.filter(p => p.role === 'villager').length;
    if (totalGods > 0 && godsAlive === 0) return 'wolf';
    if (totalVill > 0 && villAlive === 0) return 'wolf';
  }
  return null;
}

function endGame(winner) {
  state.phase = 'over';
  state.step = 'over';
  state.winner = winner;
  log(winner === 'good' ? '🎉 好人阵营胜利！' : '🐺 狼人阵营胜利！', 'result');
}

/* =========================================================================
 * 渲染
 * ========================================================================= */
function render() {
  renderTopbar();
  renderActionView();
  renderPlayersView();
  renderLogsView();
  document.getElementById('btnUndo').disabled = state.undoStack.length === 0;
  save();
}

function renderTopbar() {
  const el = document.getElementById('statusBar');
  let phaseText = '📝 准备阶段';
  if (state.phase === 'night') phaseText = `🌙 第 ${state.night} 夜`;
  else if (state.phase === 'day') phaseText = `☀️ 第 ${state.day} 天`;
  else if (state.phase === 'over') phaseText = '🏁 对局结束';

  const alive = state.players.filter(p => p.alive).length;
  const total = state.players.length;
  const sheriff = state.sheriffId ? getP(state.sheriffId) : null;

  el.innerHTML =
    `<span class="chip">${phaseText}</span>` +
    (total ? `<span class="chip muted">存活 ${alive}/${total}</span>` : '') +
    (sheriff && sheriff.alive ? `<span class="chip muted">👑 ${escapeHtml(sheriff.name)}</span>` : '');
}

/* ---------- 目标选择网格 ---------- */
function grid(players) {
  return '<div class="target-grid">' + players.map(p =>
    `<button class="target-btn" data-pid="${p.id}">
       <span class="tb-seat">${p.seat}</span>
       <span class="tb-name">${escapeHtml(p.name)}</span>
     </button>`).join('') + '</div>';
}
function bindGrid(root, cb) {
  root.querySelectorAll('.target-btn').forEach(btn => {
    btn.onclick = () => cb(Number(btn.dataset.pid));
  });
}

/* =========================================================================
 * 视图一：操作台
 * ========================================================================= */
function renderActionView() {
  const el = document.getElementById('view-action');
  switch (state.step) {
    case 'setup':        return renderSetup(el);
    case 'night_wolf':   return renderNightWolf(el);
    case 'night_seer':   return renderNightSeer(el);
    case 'night_witch':  return renderNightWitch(el);
    case 'night_hunter': return renderHunter(el, 'night');
    case 'day_start':    return renderDayStart(el);
    case 'day_sheriff':  return renderDaySheriff(el);
    case 'day_vote':     return renderDayVote(el);
    case 'day_hunter':   return renderHunter(el, 'day');
    case 'day_end':      return renderDayEnd(el);
    case 'over':         return renderOver(el);
    default:
      el.innerHTML = `<div class="card"><h2>等待中</h2><p class="muted">请按流程操作。</p></div>`;
  }
}

/* =========================================================================
 * 步骤：游戏设置
 * ========================================================================= */

        </div>
      </div>

    <div class="card">
      <h2>② 角色配置</h2>

      <h2>③ 规则选项</h2>

        <label>
          <input type="checkbox" id="hasSheriff" ${state.config.hasSheriff ? 'checked' : ''}>

        </label>
      </div>
      <div class="field">
        <label for="winMode">胜负判定方式</label>
        <select id="winMode">
          <option value="side" ${state.config.winMode === 'side' ? 'selected' : ''}>屠边（杀光所有神职或所有平民）</option>
          <option value="all" ${state.config.winMode === 'all' ? 'selected' : ''}>屠城（杀光全部好人）</option>
        </select>

    </div>

    <div class="card">
      <h2>④ 玩家昵称</h2>
      <p class="hint">每行一个昵称，留空自动补为「玩家N」。</p>
      <div class="field">
        <textarea id="namesTa" rows="8" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
      </div>

      <button class="primary block" id="btnStart">🎲 开始游戏 · 随机分配身份</button>
    </div>
  `;

  // ---- 事件绑定 ----
  document.getElementById('presetSel').onchange = (e) => {
    if (e.target.value === 'custom') return;
    const p = PRESETS[e.target.value];
    state.config.playerCount = p.playerCount;
    state.config.roles = Object.assign({}, p.roles);
    document.getElementById('playerCount').value = p.playerCount;
    document.querySelectorAll('#roleGrid input').forEach(i => {
      i.value = state.config.roles[i.dataset.role] || 0;
    });
    syncNameRows(p.playerCount);
    updateSetupSummary();
  };

  document.getElementById('playerCount').onchange = (e) => {
    const v = Math.max(4, Math.min(24, Number(e.target.value) || 4));
    state.config.playerCount = v;
    e.target.value = v;
    syncNameRows(v);
    updateSetupSummary();
  };

  document.querySelectorAll('#roleGrid input').forEach(i => {
    i.onchange = () => updateSetupSummary();
  });

  document.getElementById('hasSheriff').onchange = (e) => {
    state.config.hasSheriff = e.target.checked; save();

// 同步昵称文本域行数
function syncNameRows(count) {
  const ta = document.getElementById('namesTa');
  if (!ta) return;
  const lines = ta.value.split('\n').map(s => s.trim());
  const out = [];
  for (let i = 0; i < count; i++) out.push(lines[i] || `玩家${i + 1}`);
  ta.value = out.join('\n');
}

// 设置校验提示
function updateSetupSummary() {
  const gridEl = document.getElementById('roleGrid');
  const hint = document.getElementById('roleHint');
  const btn = document.getElementById('btnStart');
  if (!gridEl || !hint || !btn) return;

  const roles = {};
  let sum = 0;
  gridEl.querySelectorAll('input').forEach(i => {
    const v = Math.max(0, Number(i.value) || 0);
    roles[i.dataset.role] = v;
    sum += v;
  });
  state.config.roles = roles;

  const pc = Number(document.getElementById('playerCount').value) || 0;
  state.config.playerCount = pc;

  const ok = sum === pc && pc >= 4 && roles.wolf >= 1;
  let msg = `角色合计 ${sum} 人 / 目标 ${pc} 人。`;
  if (sum !== pc) msg += ' ❌ 人数不匹配，请调整。';
  else if (roles.wolf < 1) msg += ' ❌ 至少需要 1 名狼人。';
  else msg += ' ✅ 配置正确，可以开始。';

  hint.textContent = msg;
  hint.className = 'hint ' + (ok ? 'ok' : 'err');
  btn.disabled = !ok;
}

// 开始游戏
function startGame() {
  const roles = state.config.roles;
  const pc = state.config.playerCount;
  let sum = 0;
  Object.values(roles).forEach(v => sum += v);

  if (sum !== pc) { toast(`角色合计 ${sum} 人不等于玩家 ${pc} 人`); return; }
  if (roles.wolf < 1) { toast('至少需要 1 名狼人'); return; }

  // 昵称去重与补全
  const raw = document.getElementById('namesTa').value.split('\n').map(s => s.trim());
  const used = new Set();
  const names = [];
  for (let i = 0; i < pc; i++) {
    const base = raw[i] || `玩家${i + 1}`;
    let name = base, k = 1;
    while (used.has(name)) { k++; name = base + k; }
    used.add(name);
    names.push(name);
  }

  // 身份池随机
  const pool = [];
  Object.keys(roles).forEach(r => { for (let i = 0; i < roles[r]; i++) pool.push(r); });
  shuffle(pool);

  state.players = names.map((name, idx) => ({
    id: idx + 1,
    seat: idx + 1,
    name,
    role: pool[idx],
    alive: true,
    isSheriff: false,
    idiotRevealed: false,
    witchHealUsed: false,
    witchPoisonUsed: false,
    hunterShotUsed: false,
    canVote: true
  }));

  // 重置对局数据
  state.sheriffId = null;
  state.day = 0;
  state.night = 0;
  state.logs = [];
  state.undoStack = [];
  state.winner = null;
  state.voteChoices = {};
  state.voteResult = null;
  state.lastNightDeaths = [];
  state.hideRoles = false;
  state.pendingHunter = null;

  log('游戏开始，身份已随机分配。', 'phase');
  log('角色配置：' + Object.keys(roles).filter(r => roles[r] > 0)
      .map(r => `${ROLE_DEFS[r].name}×${roles[r]}`).join('，'), 'phase');

  startNight();
  document.getElementById('view-action').dataset.built = '';
  toast('身份已分配，请开始第一夜');
  render();
}

/* =========================================================================
 * 夜晚：女巫
 * ========================================================================= */
function renderNightWitch(el) {
  const witch = state.players.find(p => p.role === 'witch');
  const wi = state.nightInfo;
  const wolfTarget = wi.wolfTarget ? getP(wi.wolfTarget) : null;
  const canHeal = !witch.witchHealUsed && !!wolfTarget;
  const canPoison = !witch.witchPoisonUsed;

  let html = `<div class="card">
    <h2>🌙 第 ${state.night} 夜 · 女巫用药</h2>
    <p class="hint">今晚狼人击杀目标：<b>${wolfTarget ? `${wolfTarget.seat}号 ${escapeHtml(wolfTarget.name)}` : '空刀'}</b></p>`;

  if (canHeal) {
    html += `<button class="primary block" id="heal">🧪 使用解药救 ${escapeHtml(wolfTarget.name)}</button>`;
  } else if (witch.witchHealUsed) {
    html += `<p class="hint">（解药已使用）</p>`;
  }

  if (canPoison) {
    html += `<p class="hint" style="margin-top:16px">☠️ 使用毒药，选择目标（女巫不可毒自己）：</p>`;
    html += grid(alivePlayers().filter(p => p.id !== witch.id));
  } else {
    html += `<p class="hint" style="margin-top:16px">（毒药已使用）</p>`;
  }

  html += `<button class="ghost block" id="skip" style="margin-top:6px">不使用药水 / 跳过</button></div>`;
  el.innerHTML = html;

  const healBtn = el.querySelector('#heal');
  if (healBtn) {
    healBtn.onclick = () => {
      pushUndo();
      witch.witchHealUsed = true;
      state.nightInfo.witchSaved = true;
      log(`女巫使用解药救了 ${nameOf(wolfTarget.id)}`, 'witch');
      afterWitch();
      render();
    };
  }

  if (canPoison) {
    bindGrid(el, (id) => {
      pushUndo();
      witch.witchPoisonUsed = true;
      state.nightInfo.witchPoison = id;
      log(`女巫使用毒药毒杀 ${nameOf(id)}`, 'witch');
      afterWitch();
      render();
    });
  }

  el.querySelector('#skip').onclick = () => {
    pushUndo();
    log('女巫不使用药水', 'witch');
    afterWitch();
    render();
  };
}

/* =========================================================================
 * 猎人开枪（夜 / 昼通用）
 * ========================================================================= */
function renderHunter(el, ctx) {
  const h = getP(state.pendingHunter);
  if (!h) { state.step = ctx === 'night' ? 'day_start' : 'day_end'; return renderActionView(); }

  el.innerHTML = `
    <div class="card">
      <h2>🔫 猎人开枪</h2>
      <p class="hint">猎人 <b>${h.seat}号 ${escapeHtml(h.name)}</b> 出局，可开枪带走一名玩家。</p>
      ${grid(alivePlayers())}
      <button class="ghost block" id="noShot">放弃开枪</button>
    </div>`;

  bindGrid(el, (id) => {
    pushUndo();
    h.hunterShotUsed = true;
    const t = getP(id);
    t.alive = false;
    log(`猎人 ${h.name} 开枪带走 ${nameOf(id)}`, 'hunter');
    state.pendingHunter = null;

    const w = checkWin();
    if (w) { endGame(w); render(); return; }
    if (ctx === 'night') startDay();
    else state.step = 'day_end';
    render();
  });

  el.querySelector('#noShot').onclick = () => {
    pushUndo();
    h.hunterShotUsed = true;
    log(`猎人 ${h.name} 放弃开枪`, 'hunter');
    state.pendingHunter = null;
    if (ctx === 'night') startDay();
    else state.step = 'day_end';
    render();
  };
}

/* =========================================================================
 * 白天：天亮公布
 * ========================================================================= */
function renderDayStart(el) {
  const deaths = state.lastNightDeaths || [];
  let html = `<div class="card">
    <h2>☀️ 第 ${state.day} 天 · 天亮</h2>`;

  html += deaths.length
    ? `<p class="death-line">昨夜死亡：${deaths.map(nameOf).join('、')}</p>`
    : `<p class="safe-line">🌤 平安夜，无人死亡</p>`;

  const sheriff = state.sheriffId ? getP(state.sheriffId) : null;

  // 警长死亡 → 移交警徽
  if (sheriff && !sheriff.alive) {
    html += `<p class="hint">警长 <b>${escapeHtml(sheriff.name)}</b> 已死亡，请选择警徽移交给谁：</p>
      ${grid(alivePlayers())}
      <button class="ghost block" id="lostBadge">警徽流失（无人继任）</button></div>`;
    el.innerHTML = html;

    bindGrid(el, (id) => {
      pushUndo();
      const np = getP(id);
      sheriff.isSheriff = false;
      np.isSheriff = true;
      state.sheriffId = id;
      log(`警徽移交给 ${nameOf(id)}`, 'phase');
      render();
    });
    el.querySelector('#lostBadge').onclick = () => {
      pushUndo();
      sheriff.isSheriff = false;
      state.sheriffId = null;
      log('警徽流失，本局无警长', 'phase');
      render();
    };
    return;
  }

  const needSheriff = state.day === 1 && state.config.hasSheriff && !state.sheriffId;
  html += `<button class="primary block" id="next">${needSheriff ? '👑 开始警长竞选' : '🗳️ 进入投票放逐'}</button></div>`;
  el.innerHTML = html;

  el.querySelector('#next').onclick = () => {
    pushUndo();
    state.step = needSheriff ? 'day_sheriff' : 'day_vote';

/* =========================================================================
 * 白天：警长竞选

/* =========================================================================
 * 白天：投票放逐
 * ========================================================================= */
function renderDayVote(el) {
  const alive = alivePlayers();
  alive.forEach(p => { if (!(p.id in state.voteChoices)) state.voteChoices[p.id] = ''; });

  let html = `<div class="card"><h2>🗳️ 第 ${state.day} 天 · 投票放逐</h2>`;

  if (state.voteResult) {
    // ---- 已统计 ----
    const { counts, top } = state.voteResult;
    html += `<h3>票数统计</h3><div class="tally-list">`;
    const ids = Object.keys(counts);
    if (!ids.length) {
      html += `<div class="tally-row"><span>全场弃票</span><b>0 票</b></div>`;
    } else {
      ids.sort((a, b) => counts[b] - counts[a]).forEach(id => {
        html += `<div class="tally-row"><span>${nameOf(id)}</span><b>${counts[id]} 票</b></div>`;
      });
    }
    html += `</div>`;

    if (top && top.length) {
      html += `<p class="hint">${top.length === 1 ? '最高票' : '⚠️ 出现平票'}：${top.map(nameOf).join('、')}。请点击确认放逐对象：</p>`;
      html += grid(top.map(getP));
    } else {
      html += `<p class="hint">全场弃票，本轮无人出局。</p>
        <button class="primary block" id="skipExile">进入白天结算</button>`;
    }
    html += `</div>`;
  } else {
    // ---- 录入投票 ----
    html += `<p class="hint">为每位存活玩家选择投票对象，然后统计票数。</p><div class="vote-list">`;
    alive.forEach(p => {
      const noVote = p.canVote === false;
      // 已翻牌白痴不再成为被放逐目标
      const targets = alive.filter(q => q.id !== p.id && !q.idiotRevealed);
      html += `<div class="vote-row">
        <span class="vn">${p.seat}号 ${escapeHtml(p.name)}${p.isSheriff ? ' 👑' : ''}${noVote ? ' <em>(无票权)</em>' : ''}</span>
        <select data-voter="${p.id}" ${noVote ? 'disabled' : ''}>
          <option value="">弃票</option>
          ${targets.map(q =>
            `<option value="${q.id}" ${String(state.voteChoices[p.id]) === String(q.id) ? 'selected' : ''}>${q.seat}号 ${escapeHtml(q.name)}</option>`
          ).join('')}
        </select>
      </div>`;
    });
    html += `</div><button class="primary block" id="tally">📊 统计票数</button></div>`;
  }

  el.innerHTML = html;

  if (state.voteResult) {
    const top = state.voteResult.top;
    if (top && top.length) {
      bindGrid(el, (id) => exile(id));
    } else {
      const b = el.querySelector('#skipExile');
      if (b) b.onclick = () => { pushUndo(); state.step = 'day_end'; render(); };
    }
  } else {
    el.querySelectorAll('select[data-voter]').forEach(sel => {
      sel.onchange = () => { state.voteChoices[sel.dataset.voter] = sel.value; save(); };
    });
    el.querySelector('#tally').onclick = tallyVotes;
  }
}

// 统计票数
function tallyVotes() {
  pushUndo();
  const counts = {};
  alivePlayers().forEach(p => {
    if (p.canVote === false) return;
    const t = state.voteChoices[p.id];
    if (t) {
      const tid = Number(t);
      counts[tid] = (counts[tid] || 0) + 1;
    }
  });

  const values = Object.values(counts);
  const max = values.length ? Math.max(...values) : 0;
  const top = max > 0 ? Object.keys(counts).filter(k => counts[k] === max).map(Number) : [];
  state.voteResult = { counts, top };

  log('投票统计：' + (Object.keys(counts).length
    ? Object.keys(counts).map(id => `${nameOf(id)} ${counts[id]}票`).join('，')
    : '全场弃票'), 'vote');

  render();
}

// 放逐结算
function exile(id) {
  pushUndo();
  const p = getP(id);

  // 白痴已翻牌：不能被再次放逐
  if (p.role === 'idiot' && p.idiotRevealed) {
    log('白痴已翻牌，本轮无人出局', 'vote');
    toast('白痴已翻牌，无人出局');
    state.step = 'day_end';
    render();
    return;
  }

  log(`投票结果：${nameOf(id)} 被放逐出局`, 'vote');

  // 白痴翻牌免死
  if (p.role === 'idiot') {
    p.idiotRevealed = true;
    p.canVote = false;
    log('白痴翻牌，免于放逐，但失去投票权 🃏', 'skill');
    toast('白痴翻牌，免于放逐');
    state.step = 'day_end';
    render();
    return;
  }

  p.alive = false;
  p.canVote = false;

  // 猎人被放逐可开枪
  if (p.role === 'hunter' && !p.hunterShotUsed) {
    state.pendingHunter = p.id;
    state.step = 'day_hunter';
    render();
    return;
  }

  const w = checkWin();
  if (w) { endGame(w); render(); return; }

  state.step = 'day_end';
  render();
}

/* =========================================================================
 * 白天结束
 * ========================================================================= */
function renderDayEnd(el) {
  const w = checkWin();
  if (w) { endGame(w); renderOver(el); return; }

  el.innerHTML = `
    <div class="card">
      <h2>🌇 第 ${state.day} 天 · 白天结束</h2>
      <p class="hint">请处理出局玩家遗言与警徽归属，然后进入夜晚。</p>
      <button class="primary block" id="next">🌙 天黑请闭眼 · 进入第 ${state.day + 1} 夜</button>
    </div>`;
  el.querySelector('#next').onclick = () => {
    pushUndo();
    startNight();
    render();
  };
}

/* =========================================================================
 * 对局结束
 * ========================================================================= */
function renderOver(el) {
  const rows = state.players.map(p => `
    <div class="reveal-row">
      <span class="rn">${p.seat}号 ${escapeHtml(p.name)}</span>
      <span class="role-tag role-${p.role}">${ROLE_DEFS[p.role].name}</span>
      <span class="muted small">${p.alive ? '存活' : '出局'}</span>
    </div>`).join('');

  el.innerHTML = `
    <div class="card">
      <div class="win-title ${state.winner === 'good' ? 'good' : 'bad'}">
        ${state.winner === 'good' ? '🎉 好人阵营胜利' : '🐺 狼人阵营胜利'}
      </div>
      <h3>全部身份揭晓</h3>
      <div class="reveal-list">${rows}</div>
      <div class="btn-row">
        <button class="primary block" id="again">🔄 重置并开始新对局</button>
      </div>
    </div>`;
  el.querySelector('#again').onclick = () => {
    if (confirm('确定要重置当前对局吗？所有记录将被清空。')) resetGame();
  };
}

/* =========================================================================
 * 视图二：玩家席
 * ========================================================================= */
function renderPlayersView() {
  const el = document.getElementById('view-players');

  if (!state.players.length) {
    el.innerHTML = `<div class="card">
      <h2>👥 玩家席</h2>
      <div class="empty"><span class="ico">🪑</span>尚未分配身份<br>请先在「操作台」完成游戏设置</div>
    </div>`;
    return;
  }

  const alive = state.players.filter(p => p.alive).length;
  const dead = state.players.length - alive;

  let html = `<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px">
      <h2 style="margin:0">👥 玩家席</h2>
      <button class="mini" id="toggleRoles">${state.hideRoles ? '👁 显示身份' : '🙈 隐藏身份'}</button>
    </div>
    <p class="muted small" style="margin:0 0 12px">存活 ${alive} 人 · 出局 ${dead} 人</p>
    <div class="player-list">`;

  state.players.forEach(p => {
    html += `
      <div class="player-card ${p.alive ? '' : 'dead'} ${p.isSheriff ? 'sheriff' : ''}">
        <span class="p-seat">${p.seat}</span>
        <span class="p-name">${escapeHtml(p.name)}</span>
        ${state.hideRoles ? '' : `<span class="role-tag role-${p.role}">${ROLE_DEFS[p.role].name}</span>`}
        ${p.isSheriff ? '<span class="badge" title="警长">👑</span>' : ''}
        ${p.idiotRevealed ? '<span class="badge" title="白痴已翻牌">🃏</span>' : ''}
        ${p.alive ? '' : '<span class="badge" title="已出局">💀</span>'}
      </div>`;
  });
  html += `</div></div>`;
  el.innerHTML = html;

  el.querySelector('#toggleRoles').onclick = () => {
    state.hideRoles = !state.hideRoles;
    toast(state.hideRoles ? '身份已隐藏（可递给玩家查看）' : '身份已显示');
    render();
  };
}

/* =========================================================================
 * 视图三：日志
 * ========================================================================= */
function renderLogsView() {
  const el = document.getElementById('view-logs');
  const items = state.logs.slice().reverse();

  el.innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px">
        <h2 style="margin:0">📜 操作日志</h2>
        <span class="muted small">${state.logs.length} 条</span>
      </div>
      ${items.length
        ? `<div class="log-list">${items.map(l =>
            `<div class="log-item ${l.type}">
               <span class="lt">${fmtTime(l.t)}</span>
               <span>${escapeHtml(l.text)}</span>
             </div>`).join('')}</div>`
        : `<div class="empty"><span class="ico">📄</span>暂无日志</div>`}
    </div>

    <div class="card">
      <h2>⚙️ 对局管理</h2>
      <div class="btn-row">
        <button class="block" id="btnExport">📤 导出文本日志</button>
        <button class="danger block" id="btnReset">🗑️ 重置当前对局</button>
      </div>
    </div>`;

  el.querySelector('#btnExport').onclick = exportLogs;
  el.querySelector('#btnReset').onclick = () => {
    if (confirm('确定要重置当前对局吗？所有记录将被清空，且无法恢复。')) resetGame();
  };
}

/* =========================================================================
 * 全局操作
 * ========================================================================= */
function resetGame() {
  localStorage.removeItem(STORAGE_KEY);
  state = freshState();
  document.getElementById('view-action').dataset.built = '';
  switchTab('action');
  toast('已重置，请重新设置');
  render();
}

function exportLogs() {
  if (!state.logs.length) { toast('当前没有日志可导出'); return; }

  const cfg = state.config.roles;
  const header = [
    '狼人杀对局记录',
    '生成时间：' + new Date().toLocaleString(),
    '板子：' + Object.keys(cfg).filter(r => cfg[r] > 0).map(r => `${ROLE_DEFS[r].name}×${cfg[r]}`).join('，'),
    '警长：' + (state.config.hasSheriff ? '启用' : '未启用'),
    '胜负判定：' + (state.config.winMode === 'side' ? '屠边' : '屠城'),
    state.winner ? ('结果：' + (state.winner === 'good' ? '好人阵营胜利' : '狼人阵营胜利')) : '结果：对局进行中',
    '----------------------------------------'
  ].join('\n');

  const body = state.logs.map(l => {
    const d = new Date(l.t);
    const ts = String(d.getHours()).padStart(2, '0') + ':' +
               String(d.getMinutes()).padStart(2, '0') + ':' +
               String(d.getSeconds()).padStart(2, '0');
    return `[${ts}] ${l.text}`;
  }).join('\n');

  const blob = new Blob([header + '\n' + body], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `狼人杀日志_${new Date().toISOString().slice(0, 10)}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('日志已导出');
}

/* =========================================================================
 * 标签页切换
 * ========================================================================= */
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === name);
  });
  ['action', 'players', 'logs'].forEach(k => {
    document.getElementById('view-' + k).hidden = (k !== name);
  });
  document.getElementById('viewport').scrollTop = 0;
}

/* =========================================================================
 * 初始化
 * ========================================================================= */
function init() {
  // 标签栏事件
  document.querySelectorAll('.tab').forEach(btn => {
    btn.onclick = () => {
      switchTab(btn.dataset.tab);
      // 切回操作台时重绘，保证状态最新
      if (btn.dataset.tab === 'action') renderActionView();
    };
  });

  document.getElementById('btnUndo').onclick = undo;

  // 读取本地存档
  const raw = localStorage.getItem(STORAGE_KEY);
  let loaded = null;

  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.players)) {
        throw new Error('数据结构异常');
      }
      loaded = parsed;
    } catch (e) {
      console.warn('本地存档损坏：', e);
      localStorage.removeItem(STORAGE_KEY);
      setTimeout(() => toast('本地存档损坏，已重置为新对局'), 300);
      loaded = null;
    }
  }

  if (loaded) {
    state = Object.assign(freshState(), loaded);
    state.config = Object.assign(freshState().config, state.config || {});
    state.nightInfo = Object.assign(
      { wolfTarget: null, seerTarget: null, seerResult: null, witchSaved: false, witchPoison: null, deaths: [] },
      state.nightInfo || {}
    );
    state.undoStack = [];
    state.logs = state.logs || [];
    if (!state.players.length) state.step = 'setup';
  } else {
    state = freshState();
  }

  // 阻止移动端双击缩放
  let lastTouch = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouch < 300) e.preventDefault();
    lastTouch = now;
  }, { passive: false });

  switchTab('action');
  render();

  if (loaded && state.players.length) {
    setTimeout(() => toast('已恢复上次对局进度'), 400);
  }
}

init();
</script>
